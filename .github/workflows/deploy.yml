name: 🚀 Build y Despliegue (Hostinger + Firebase)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Obtener código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Instalar Dependencias
        run: |
          npm install
          cd functions && npm install

      - name: 🏗️ Compilar (Build)
        run: npm run build

      - name: 🔄 Desplegar Frontend a Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/graduaciones2026/
          server-dir: public_html/graduaciones2026/
          protocol: ftp
          port: 21
          dangerous-clean-slate: true

      - name: 🔥 Desplegar Functions a Firebase
        uses: w9jds/firebase-action@v13.6.0
        with:
          args: deploy --only functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
