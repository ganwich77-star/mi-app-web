name: 🚀 Despliegue a Hostinger

on:
  push:
    branches:
      - main  # Esto hace que se actualice solo al aprobar cambios en main

jobs:
  web-deploy:
    name: 🚚 Sync Files
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Obtener código de GitHub
        uses: actions/checkout@v4

      - name: 🔄 Subir a Hostinger vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
